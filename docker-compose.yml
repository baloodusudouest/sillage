# Service sillage à placer dans la stack homelab.yml (Portainer).
# Les variables viennent des « Environment variables » de la stack (voir .env.example).
services:
  sillage:
    image: ghcr.io/baloodusudouest/sillage:${SILLAGE_VERSION:-latest}
    container_name: sillage
    restart: unless-stopped
    ports:
      - "${PORT_SILLAGE:-8093}:8093"                 # réseau local et Tailscale uniquement
    environment:
      - TZ=Europe/Paris
      # Variables communes de la maison (module app/maison.py)
      - MAISON_PASSWORD=${MAISON_PASSWORD}           # mot de passe commun des applis (12 caractères au moins)
      - MAISON_JETON=${MAISON_JETON:-}               # jeton commun : envoyé à carnet, à Chambre noire et à l'Anneau ; ouvre /externe/sauvegarde
      - SILLAGE_IMMICH_URL=http://immich_server:2283 # Immich vu depuis la stack
      - SILLAGE_IMMICH_CLE=${SILLAGE_IMMICH_CLE}     # clé d'API Immich, en lecture seule
      - SILLAGE_CARNET_URL=http://carnet:8096          # carnet vu depuis la stack
      - SILLAGE_JETON_HA=${SILLAGE_JETON_HA:-}       # jeton propre à Home Assistant (/ha/sejour) ; vide : adresse fermée
      # 0.16 : les réglages d'usage (mots des temps forts, dossiers muets, place des vignettes, tags de Millésime)
      # se règlent dans l'écran Réglages de Sillage. Ils ont été repris une fois des anciennes variables de la stack
      # (SILLAGE_MOTS, SILLAGE_DOSSIERS_MUETS, SILLAGE_CACHE_MO, SILLAGE_TAG_ESTIMEE, SILLAGE_TAG_NON_DATEE) au premier
      # démarrage de la 0.16 ; ces lignes ne servent plus. L'adresse d'Immich pour le navigateur vient de l'Anneau.
    volumes:
      - ${SILLAGE_DATA_DIR}:/data                    # base de Sillage, réglages, vignettes gardées
